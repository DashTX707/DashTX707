name: Update terminal GIF

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-terminal-gif:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIFOS_GENERAL_COLOR_SCHEME: dashtx
      GIFOS_GENERAL_USER_NAME: DashTX707
      GIFOS_FILES_OUTPUT_GIF_NAME: terminal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install github-readme-terminal
        run: python -m pip install --upgrade pip github-readme-terminal

      - name: Install custom color scheme
        run: |
          mkdir -p ~/.config/gifos
          cp .github/scripts/ansi_escape_colors.toml ~/.config/gifos/ansi_escape_colors.toml

      - name: Generate terminal GIF
        run: python .github/scripts/gen_terminal_gif.py

      - name: Move generated GIF into assets
        run: |
          mkdir -p assets
          gif_path=$(find . -maxdepth 3 -name "terminal.gif" ! -path "./assets/*" | head -n1)
          if [ -z "$gif_path" ]; then
            echo "::error::terminal.gif not found after generation"
            exit 1
          fi
          mv "$gif_path" assets/terminal.gif

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.gif
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m ":robot: Update terminal GIF"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest ${GITHUB_REF_NAME} and retrying..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "::error::Failed to push terminal.gif after retries"
          exit 1
