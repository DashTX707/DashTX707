  </defs>
  <text x="310" y="70" text-anchor="middle" font-family="'Fira Code', 'Courier New', Consolas, monospace" font-weight="500" font-size="42" fill="#00FF41" filter="url(#glow)">Hi, I'm Ibrahim</text>
  <text x="310" y="130" text-anchor="middle" font-family="'Fira Code', 'Courier New', Consolas, monospace" font-weight="500" font-size="42" fill="#00FF41" filter="url(#glow)">Abdl-Razik 👋</text>
</svg>
